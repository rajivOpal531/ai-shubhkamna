# Override for a GPU host: build the CUDA image and hand every NVIDIA GPU to the api container.
# Not loaded by default (the CPU host would fail to start with a device reservation it cannot
# satisfy). Enable it once per host by listing it in deploy/.env, which every compose call in
# deploy.sh and rollout-api.sh picks up:
#   echo "COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml" >> .env
# Needs NVIDIA driver >= 580 (CUDA 13) and the NVIDIA Container Toolkit on the host; see
# DEPLOYMENT.md, "GPU host".
services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile.gpu
    environment:
      # rembg falls back to CPU silently when the GPU is unreachable. Refuse to start instead, so
      # rollout-api.sh sees an unhealthy container and keeps the old one serving.
      REQUIRE_GPU: "true"
    # The api runs as an unprivileged user (uid 10001). On SUSE the NVIDIA device nodes are
    # root:video mode 0660, so that user gets "Insufficient Permissions" / "no CUDA-capable device".
    # Put NVIDIA_DEVICE_GID=$(stat -c %g /dev/nvidiactl) in deploy/.env on such hosts; the default
    # (root group, gid 0) grants nothing extra where the nodes are 0666 (Ubuntu, Amazon Linux).
    group_add:
      - "${NVIDIA_DEVICE_GID:-0}"
    deploy:
      resources:
        reservations:
          devices:
            # CDI (Container Device Interface) is how current Docker (28+, and 25+ with the "cdi"
            # feature on) hands GPUs to containers; it is the path `docker run --gpus all` takes.
            # The older `driver: nvidia` reservation goes through the legacy hook and on such hosts
            # starts the container with no GPU at all (rembg then fails REQUIRE_GPU). The device
            # names come from `nvidia-ctk cdi list` after `nvidia-ctk cdi generate`.
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
